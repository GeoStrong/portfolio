<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)"/>
  
  <!-- Inner glow effect -->
  <rect x="12" y="12" width="168" height="168" rx="36" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- "GJ" Text -->
  <text 
    x="96" 
    y="132" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="92" 
    font-weight="800" 
    text-anchor="middle" 
    fill="url(#textGrad)"
    letter-spacing="-4"
  >GJ</text>
  
  <!-- Small code bracket accent -->
  <g opacity="0.4">
    <path d="M 40 40 L 30 50 L 40 60" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 152 40 L 162 50 L 152 60" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
